<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>GitHub release page: under Assets, download cmi_woocommerce_v2.0.0.zip, not the Source code files</title>
  <defs><clipPath id="frame"><rect width="760" height="330" rx="10"/></clipPath></defs>
  <g clip-path="url(#frame)">
    <rect width="760" height="330" fill="#ffffff"/>

    <!-- Browser bar -->
    <rect width="760" height="36" fill="#f6f8fa"/>
    <line x1="0" y1="36" x2="760" y2="36" stroke="#d0d7de"/>
    <circle cx="20" cy="18" r="5" fill="#ff5f57"/>
    <circle cx="36" cy="18" r="5" fill="#febc2e"/>
    <circle cx="52" cy="18" r="5" fill="#28c840"/>
    <rect x="72" y="8" width="460" height="20" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <text x="86" y="22" font-size="12" fill="#57606a">github.com/cmi-solutions/woocommerce_cmi/releases/latest</text>

    <!-- Release header -->
    <text x="28" y="82" font-size="24" font-weight="600" fill="#1f2328">CMI Payment Gateway 2.0.0</text>
    <rect x="356" y="63" width="60" height="24" rx="12" fill="#ffffff" stroke="#1a7f37"/>
    <text x="386" y="80" font-size="12" font-weight="600" fill="#1a7f37" text-anchor="middle">Latest</text>
    <text x="28" y="110" font-size="13" fill="#57606a">Tag v2.0.0</text>
    <line x1="28" y1="126" x2="732" y2="126" stroke="#d8dee4"/>

    <!-- Assets heading -->
    <path d="M30 148 l6 7 l6 -7 z" fill="#1f2328"/>
    <text x="50" y="158" font-size="18" font-weight="600" fill="#1f2328">Assets</text>
    <rect x="112" y="143" width="22" height="20" rx="10" fill="#eaeef2"/>
    <text x="123" y="157" font-size="12" fill="#1f2328" text-anchor="middle">3</text>

    <!-- Assets table -->
    <rect x="28.5" y="172.5" width="703" height="126" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <line x1="29" y1="214.5" x2="731" y2="214.5" stroke="#d8dee4"/>
    <line x1="29" y1="256.5" x2="731" y2="256.5" stroke="#d8dee4"/>

    <g fill="none" stroke="#57606a" stroke-width="1.5">
      <rect x="44" y="185" width="14" height="16" rx="2"/><line x1="44" y1="191" x2="58" y2="191"/>
      <rect x="44" y="227" width="14" height="16" rx="2"/><line x1="44" y1="233" x2="58" y2="233"/>
      <rect x="44" y="269" width="14" height="16" rx="2"/><line x1="44" y1="275" x2="58" y2="275"/>
    </g>
    <text x="70" y="198" font-size="14" font-weight="600" fill="#0969da">cmi_woocommerce_v2.0.0.zip</text>
    <text x="712" y="198" font-size="12" fill="#57606a" text-anchor="end">102 KB</text>
    <text x="70" y="240" font-size="14" fill="#0969da">Source code (zip)</text>
    <text x="712" y="240" font-size="12" font-style="italic" fill="#8c959f" text-anchor="end">Not the plugin: don't download</text>
    <text x="70" y="282" font-size="14" fill="#0969da">Source code (tar.gz)</text>
    <text x="712" y="282" font-size="12" font-style="italic" fill="#8c959f" text-anchor="end">Not the plugin: don't download</text>

    <!-- Highlight -->
    <rect x="22" y="167" width="716" height="52" rx="8" fill="none" stroke="#d63638" stroke-width="3"/>
    <rect x="304" y="180" width="152" height="26" rx="13" fill="#d63638"/>
    <text x="380" y="198" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Download this file</text>
  </g>
  <rect x="0.5" y="0.5" width="759" height="329" rx="10" fill="none" stroke="#d0d7de"/>
