<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>WordPress: after the upload, 5 click Activate Plugin</title>
  <defs><clipPath id="frame"><rect width="760" height="260" rx="10"/></clipPath></defs>
  <g clip-path="url(#frame)">
    <rect width="760" height="260" fill="#f0f0f1"/>

    <!-- Browser bar -->
    <rect width="760" height="36" fill="#f6f8fa"/>
    <line x1="0" y1="36" x2="760" y2="36" stroke="#d0d7de"/>
    <circle cx="20" cy="18" r="5" fill="#ff5f57"/>
    <circle cx="36" cy="18" r="5" fill="#febc2e"/>
    <circle cx="52" cy="18" r="5" fill="#28c840"/>
    <rect x="72" y="8" width="460" height="20" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <text x="86" y="22" font-size="12" fill="#57606a">your-shop.com/wp-admin/update.php?action=upload-plugin</text>

    <!-- WordPress admin bar -->
    <rect y="36" width="760" height="24" fill="#1d2327"/>
    <text x="16" y="52" font-size="12" fill="#f0f0f1">Your Shop</text>

    <text x="28" y="98" font-size="20" fill="#1d2327">Installing plugin from uploaded file: cmi_woocommerce_v2.0.0.zip</text>
    <g font-size="13" fill="#1d2327">
      <text x="28" y="135">Unpacking the package…</text>
      <text x="28" y="160">Installing the plugin…</text>
      <text x="28" y="185">Plugin installed successfully.</text>
    </g>
    <rect x="28" y="205" width="122" height="32" rx="3" fill="#2271b1"/>
    <text x="89" y="226" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Activate Plugin</text>
    <text x="168" y="226" font-size="13" fill="#2271b1">Go to Plugin Installer</text>

    <!-- Highlight and step number -->
    <rect x="22" y="199" width="134" height="44" rx="7" fill="none" stroke="#d63638" stroke-width="2.5"/>
    <circle cx="156" cy="200" r="11" fill="#d63638"/>
    <text x="156" y="204" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  </g>
  <rect x="0.5" y="0.5" width="759" height="259" rx="10" fill="none" stroke="#d0d7de"/>
</svg>
