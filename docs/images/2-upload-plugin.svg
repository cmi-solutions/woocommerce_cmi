<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>WordPress: 1 Plugins, Add New Plugin; 2 Upload Plugin; 3 Choose File and select the zip; 4 Install Now</title>
  <defs><clipPath id="frame"><rect width="760" height="400" rx="10"/></clipPath></defs>
  <g clip-path="url(#frame)">
    <rect width="760" height="400" fill="#f0f0f1"/>

    <!-- Browser bar -->
    <rect width="760" height="36" fill="#f6f8fa"/>
    <line x1="0" y1="36" x2="760" y2="36" stroke="#d0d7de"/>
    <circle cx="20" cy="18" r="5" fill="#ff5f57"/>
    <circle cx="36" cy="18" r="5" fill="#febc2e"/>
    <circle cx="52" cy="18" r="5" fill="#28c840"/>
    <rect x="72" y="8" width="460" height="20" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <text x="86" y="22" font-size="12" fill="#57606a">your-shop.com/wp-admin/plugin-install.php?tab=upload</text>

    <!-- WordPress admin bar -->
    <rect y="36" width="760" height="24" fill="#1d2327"/>
    <text x="16" y="52" font-size="12" fill="#f0f0f1">Your Shop</text>

    <!-- Sidebar -->
    <rect y="60" width="170" height="340" fill="#1d2327"/>
    <g font-size="13" fill="#f0f0f1">
      <text x="30" y="86">Dashboard</text>
      <text x="30" y="112">Posts</text>
      <text x="30" y="138">Media</text>
      <text x="30" y="164">Pages</text>
      <text x="30" y="190">WooCommerce</text>
      <text x="30" y="216">Products</text>
      <text x="30" y="242">Appearance</text>
    </g>
    <rect y="254" width="170" height="28" fill="#2271b1"/>
    <text x="30" y="273" font-size="13" font-weight="600" fill="#ffffff">Plugins</text>
    <rect y="282" width="170" height="84" fill="#2c3338"/>
    <text x="30" y="302" font-size="13" fill="#c3c4c7">Installed Plugins</text>
    <text x="30" y="328" font-size="13" font-weight="600" fill="#ffffff">Add New Plugin</text>
    <text x="30" y="354" font-size="13" fill="#c3c4c7">Plugin File Editor</text>
    <text x="30" y="388" font-size="13" fill="#f0f0f1">Users</text>

    <!-- Main area -->
    <text x="190" y="102" font-size="23" fill="#1d2327">Add Plugins</text>
    <rect x="330.5" y="82.5" width="118" height="28" rx="3" fill="#f6f7f7" stroke="#2271b1"/>
    <text x="389.5" y="101" font-size="13" fill="#2271b1" text-anchor="middle">Upload Plugin</text>

    <rect x="190.5" y="135.5" width="550" height="130" fill="#f6f7f7" stroke="#c3c4c7"/>
    <text x="465.5" y="168" font-size="13" fill="#50575e" text-anchor="middle">If you have a plugin in a .zip format, you may install</text>
    <text x="465.5" y="187" font-size="13" fill="#50575e" text-anchor="middle">or update it by uploading it here.</text>
    <rect x="245.5" y="212.5" width="96" height="28" rx="3" fill="#e5e5e5" stroke="#8c8f94"/>
    <text x="293.5" y="231" font-size="13" fill="#1d2327" text-anchor="middle">Choose File</text>
    <text x="352" y="231" font-size="13" fill="#1d2327">cmi_woocommerce_v2.0.0.zip</text>
    <rect x="560.5" y="212.5" width="100" height="28" rx="3" fill="#f6f7f7" stroke="#2271b1"/>
    <text x="610.5" y="231" font-size="13" fill="#2271b1" text-anchor="middle">Install Now</text>

    <!-- Highlights and step numbers -->
    <g fill="none" stroke="#d63638" stroke-width="2.5">
      <rect x="6" y="314" width="158" height="22" rx="4"/>
      <rect x="325" y="77" width="129" height="39" rx="6"/>
      <rect x="240" y="207" width="107" height="39" rx="6"/>
      <rect x="555" y="207" width="111" height="39" rx="6"/>
    </g>
    <g font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">
      <circle cx="150" cy="325" r="10" fill="#d63638"/><text x="150" y="329">1</text>
      <circle cx="454" cy="78" r="11" fill="#d63638"/><text x="454" y="82">2</text>
      <circle cx="240" cy="207" r="11" fill="#d63638"/><text x="240" y="211">3</text>
      <circle cx="666" cy="207" r="11" fill="#d63638"/><text x="666" y="211">4</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="759" height="399" rx="10" fill="none" stroke="#d0d7de"/>
