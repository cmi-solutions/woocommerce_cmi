<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>WordPress, when updating: This plugin is already installed. Click Replace current with uploaded</title>
  <defs><clipPath id="frame"><rect width="760" height="360" rx="10"/></clipPath></defs>
  <g clip-path="url(#frame)">
    <rect width="760" height="360" fill="#f0f0f1"/>

    <!-- Browser bar -->
    <rect width="760" height="36" fill="#f6f8fa"/>
    <line x1="0" y1="36" x2="760" y2="36" stroke="#d0d7de"/>
    <circle cx="20" cy="18" r="5" fill="#ff5f57"/>
    <circle cx="36" cy="18" r="5" fill="#febc2e"/>
    <circle cx="52" cy="18" r="5" fill="#28c840"/>
    <rect x="72" y="8" width="460" height="20" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <text x="86" y="22" font-size="12" fill="#57606a">your-shop.com/wp-admin/update.php?action=upload-plugin</text>

    <!-- WordPress admin bar -->
    <rect y="36" width="760" height="24" fill="#1d2327"/>
    <text x="16" y="52" font-size="12" fill="#f0f0f1">Your Shop</text>

    <text x="28" y="98" font-size="20" fill="#1d2327">Installing plugin from uploaded file: cmi_woocommerce_v2.0.0.zip</text>
    <text x="28" y="130" font-size="13" fill="#1d2327">Unpacking the package…</text>
    <text x="28" y="165" font-size="16" font-weight="600" fill="#1d2327">This plugin is already installed.</text>

    <!-- Comparison table -->
    <rect x="28.5" y="180.5" width="560" height="112" fill="#ffffff" stroke="#c3c4c7"/>
    <g stroke="#dcdcde">
      <line x1="29" y1="208.5" x2="588" y2="208.5"/>
      <line x1="29" y1="236.5" x2="588" y2="236.5"/>
      <line x1="29" y1="264.5" x2="588" y2="264.5"/>
    </g>
    <g font-size="13" fill="#1d2327">
      <text x="208" y="199" font-weight="600">Current</text>
      <text x="398" y="199" font-weight="600">Uploaded</text>
      <text x="40" y="227">Plugin name</text>
      <text x="208" y="227">WooCommerce CMI Gateway</text>
      <text x="398" y="227">WooCommerce CMI Gateway</text>
      <text x="40" y="255">Version</text>
      <text x="208" y="255">1.8.0</text>
      <text x="398" y="255" font-weight="600">2.0.0</text>
      <text x="40" y="283">Author</text>
      <text x="208" y="283">cmi - CMI</text>
      <text x="398" y="283">cmi - CMI</text>
    </g>

    <!-- Buttons -->
    <rect x="28" y="306" width="222" height="32" rx="3" fill="#2271b1"/>
    <text x="139" y="327" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Replace current with uploaded</text>
    <rect x="262.5" y="306.5" width="150" height="31" rx="3" fill="#f6f7f7" stroke="#2271b1"/>
    <text x="337.5" y="327" font-size="13" fill="#2271b1" text-anchor="middle">Cancel and go back</text>

    <!-- Highlight -->
    <rect x="22" y="300" width="234" height="44" rx="7" fill="none" stroke="#d63638" stroke-width="2.5"/>
    <rect x="428" y="309" width="196" height="26" rx="13" fill="#d63638"/>
    <text x="526" y="327" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Click to update the plugin</text>
  </g>
  <rect x="0.5" y="0.5" width="759" height="359" rx="10" fill="none" stroke="#d0d7de"/>
</svg>
